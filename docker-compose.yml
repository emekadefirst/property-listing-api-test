services:
  database:
    image: postgres:17
    container_name: propertydb
    env_file:
      - ../.env
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atandanet
  property-api:
    build:
      context: ..
      dockerfile: ./Dockerfile
    container_name: property-api
    env_file:
      - ../.env
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - propertynet

volumes:
  postgres_data:

networks:
  propertynet:
    name: propertynet
    driver: bridge