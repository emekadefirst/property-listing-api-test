services:
  database:
    image: postgis/postgis:17-3.5
    container_name: propertydb
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - propertynet

  property-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: property-api
    env_file:
      - .env
    environment:
      # Inside the compose network the DB is reached by its service name
      DB_HOST: database
      DB_PORT: 5432
      APP_PORT: 3000
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - propertynet

volumes:
  postgres_data:

networks:
  propertynet:
    name: propertynet
    driver: bridge
